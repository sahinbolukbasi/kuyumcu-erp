# ==============================================================================
# 💎 Golden Guard IoT ERP - GitHub Actions CI/CD Pipeline
# ==============================================================================
# Bu pipeline:
# 1. Backend test (Python lint)
# 2. Frontend build (Next.js)
# 3. Docker image build & push
# 4. AWS EC2'ye SSH ile deploy (docker compose pull & up)
# ==============================================================================

name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Manuel tetikleme

env:
  PROJECT_NAME: kuyumculuk
  AWS_INSTANCE_IP: ${{ secrets.AWS_INSTANCE_IP }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DOCKER_COMPOSE_VERSION: v2.27.0

jobs:
  # ============================================================================
  # JOB 1: Backend Kalite Kontrolü
  # ============================================================================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint check
        run: flake8 app/ --max-line-length=140 --extend-ignore=E203,W503 --count

  # ============================================================================
  # JOB 2: Frontend Build
  # ============================================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://${{ secrets.AWS_INSTANCE_IP }}:8000

  # ============================================================================
  # JOB 3: Production Deploy (SSH + Docker)
  # ============================================================================
  deploy:
    name: Deploy to AWS EC2
    needs: [backend-lint, frontend-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.AWS_INSTANCE_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy project files to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.venv' \
            --exclude 'backend/venv' \
            --exclude 'data' \
            --exclude 'uploads' \
            ./ ubuntu@${{ secrets.AWS_INSTANCE_IP }}:/opt/${{ env.PROJECT_NAME }}/

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.AWS_INSTANCE_IP }} \
            "cd /opt/${{ env.PROJECT_NAME }} && \
             export MASTER_PASSWORD_HASH='${{ secrets.MASTER_PASSWORD_HASH }}' && \
             sudo docker compose down && \
             sudo docker compose up -d --build"

      - name: Health check
        run: |
          sleep 15
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.AWS_INSTANCE_IP }}:3000 || echo "000")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "✅ Frontend sağlıklı (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Frontend yanıt vermedi (HTTP $HTTP_CODE)"
          fi

          API_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.AWS_INSTANCE_IP }}:8000/docs || echo "000")
          if [ "$API_CODE" = "200" ] || [ "$API_CODE" = "302" ] || [ "$API_CODE" = "301" ]; then
            echo "✅ Backend sağlıklı (HTTP $API_CODE)"
          else
            echo "⚠️ Backend yanıt vermedi (HTTP $API_CODE)"
          fi

      - name: Deployment Status
        run: |
          echo "✅ Deployment tamamlandı!"
          echo "📌 Frontend: http://${{ secrets.AWS_INSTANCE_IP }}:3000"
          echo "📌 API: http://${{ secrets.AWS_INSTANCE_IP }}:8000"
          echo "📌 Swagger: http://${{ secrets.AWS_INSTANCE_IP }}:8000/docs"